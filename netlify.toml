[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[dev]
command = "vite"
port = 8888
targetPort = 5173
autoLaunch = false

[[redirects]]
from = "/api/auth"
to = "/.netlify/functions/auth"
status = 200

[[redirects]]
from = "/api/bookings"
to = "/.netlify/functions/bookings"
status = 200

[[redirects]]
from = "/api/ical"
to = "/.netlify/functions/ical"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
